pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' // downloads the JDK 17 that NeoForge 1.20.4 tooling needs
}

rootProject.name = 'NiHaoModClient'

// One subproject per Minecraft version and loader, configured by versions/<mc>/gradle.properties.
// Add a version = add a folder. `neoforge=<version>` in that file also enables a neoforge-<mc> subproject.
file('versions').eachDir { dir ->
    include "fabric-${dir.name}"
    project(":fabric-${dir.name}").projectDir = dir
    if (new File(dir, 'gradle.properties').text =~ /(?m)^neoforge=/) {
        def nf = new File(dir, 'neoforge')
        nf.mkdirs()
        include "neoforge-${dir.name}"
        project(":neoforge-${dir.name}").projectDir = nf
    }
}
